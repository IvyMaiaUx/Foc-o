    <!-- Metadados genéricos de fallback: esta casca é compartilhada por todas as
         rotas do app (autenticadas e públicas). Título/descrição por rota exigiriam
         algo como react-helmet-async — fora do escopo desta rodada. -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="Focão — plano de treino e rotina para o seu cão" />

    <meta name="twitter:image" content="https://focaoapp.com.br/og-image.png" />
    <!-- LGPD: trackers de marketing (Meta Pixel + pixel próprio) só carregam após
         consentimento. Não dispara nada até o usuário aceitar no banner. -->
    <script>
      (function () {
        window.__focaoConsent = function () {
          try { return JSON.parse(localStorage.getItem('lgpd_consent') || 'null'); }
          catch (e) { return null; }
        };
        window.__loadFocaoTrackers = function () {
          if (window.__focaoTrackersLoaded) return;
          var c = window.__focaoConsent();
          if (!c || c.marketing !== true) return; // sem consentimento de marketing → não carrega
          window.__focaoTrackersLoaded = true;
          // Meta Pixel
          !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
          n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
          n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
          t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script',
          'https://connect.facebook.net/en_US/fbevents.js');
          fbq('init', '1623631332266427');
          fbq('track', 'PageView');
          // Pixel próprio (FCT)
          var p = document.createElement('script');
          p.src = 'https://track-up.vercel.app/pixel.js';
          p.setAttribute('data-pixel', 'FCT-6A28F5');
          p.setAttribute('data-endpoint', 'https://track-up.vercel.app/api/track');
          p.async = true;
          document.head.appendChild(p);
        };
        // Quem já consentiu marketing em visita anterior: carrega imediatamente.
        window.__loadFocaoTrackers();
      })();
    </script>
